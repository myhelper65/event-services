server:
  port: 8081
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/pluralsight
    username: pluralsight
    password: pluralsight
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
