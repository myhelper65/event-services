services:
  event-service:
    image: "{{ .Values.IMAGE_TAG_EVENT_SERVICE }}"
    ports:
     - 8081:8081
    labels:
      kompose.image-pull-secret: "regcred"
  registration-service:
    image: "{{ .Values.IMAGE_TAG_REGISTRATION_SERVICE }}"
    ports:
     - 8085:8085
    labels:
      kompose.image-pull-secret: "regcred"

  
  # api-gateway:
