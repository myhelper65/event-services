services:
  mongo:
    image: "{{ .Values.IMAGE_TAG_MONGO }}"
    ports:
      - 27017:27017
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    labels:
      kompose.image-pull-secret: "regcred"

  postgres:
    image: "{{ .Values.IMAGE_TAG_POSTGRES }}"
    environment:
      POSTGRES_USER: pluralsight
      POSTGRES_PASSWORD: pluralsight
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluralsight"]
      interval: 5s
      timeout: 3s
      retries: 5
    labels:
      kompose.image-pull-secret: "regcred"

  events:
    image: "{{ .Values.IMAGE_TAG_EVENTS }}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - "SPRING_PROFILES_ACTIVE=docker"
    ports:
      - 8081:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      replicas: 2
    labels:
      kompose.image-pull-secret: "regcred"

  registration:
    image: "{{ .Values.IMAGE_TAG_REGISTRATION }}"
    depends_on:
      mongo:
        condition: service_healthy
      events:
        condition: service_healthy
    environment:
      - "SPRING_PROFILES_ACTIVE=docker"
    ports:
      - 8085:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
    labels:
      kompose.image-pull-secret: "regcred"
