  grafana-server:
    image: "{{ .Values.IMAGE_TAG_GRAFANA_SERVICE }}"
    ports:
    - 3000:3000
    labels:
      kompose.image-pull-secret: "regcred"
  prometheus-server:
    image: "{{ .Values.IMAGE_TAG_PROMETHEUS_SERVICE }}"
    ports:
    - 9091:9090
    labels:
      kompose.image-pull-secret: "regcred"

  # mysql-server:
  #   image: mysql:5.7.8
  #   environment: 
  #     MYSQL_ROOT_PASSWORD: petclinic
  #     MYSQL_DATABASE: petclinic
  #   ports:
  #   - 3306:3306


  mongo:
    image: mongo
    ports:
      - '27017:27017'
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres
    environment:
      POSTGRES_USER: pluralsight
      POSTGRES_PASSWORD: pluralsight
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluralsight"]
      interval: 5s
      timeout: 3s
      retries: 5  