# Default values for eventservice_chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets:
  - name: regcred  # Ensure this is included for private image access

# Service account configuration
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod annotations and labels
podAnnotations: {}
podLabels: {}

# Security contexts
podSecurityContext: {}
securityContext: {}

# Service configuration
service:
  type: ClusterIP
  port: 80

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# MongoDB configuration
mongo:
  image:
    repository: mongo
    tag: "6.0"
    pullPolicy: IfNotPresent

# PostgreSQL configuration
postgres:
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent

# Add events and registration image configurations
events:
  image:
    repository: 533266982090.dkr.ecr.us-east-1.amazonaws.com/eventservice-repo/eventservice-app-dev
    tag: latest  # You can set this to a specific tag or use "latest"
    pullPolicy: Always

registration:
  image:
    repository: 533266982090.dkr.ecr.us-east-1.amazonaws.com/eventservice-repo/eventservice-app-dev
    tag: latest  # You can set this to a specific tag or use "latest"
    pullPolicy: Always