apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o eventservice_chart/templates
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: postgres
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: postgres
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o eventservice_chart/templates
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: postgres
    spec:
      # 👇 This is the correct place for initContainers
      initContainers:
        - name: wait-for-config-server
          image: busybox
          command: ['sh', '-c', 'until nc -z config-server 8888; do echo waiting for config-server; sleep 2; done;']

      containers:
        - env:
            - name: POSTGRES_PASSWORD
              value: pluralsight
            - name: POSTGRES_USER
              value: pluralsight
          image: postgres
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - pluralsight
            failureThreshold: 5
            periodSeconds: 5
            timeoutSeconds: 3
          name: postgres
          ports:
            - containerPort: 5432
              protocol: TCP
      restartPolicy: Always
