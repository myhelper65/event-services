apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o eventservice_chart/templates
    kompose.image-pull-secret: regcred
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: postgres
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: postgres
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o eventservice_chart/templates
        kompose.image-pull-secret: regcred
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: postgres
    spec:
      containers:
        - env:
            - name: POSTGRES_PASSWORD
              value: pluralsight
            - name: POSTGRES_USER
              value: pluralsight
          image: '{{ .Values.IMAGE_TAG_POSTGRES }}'
          livenessProbe:
            exec:
              command:
                - pg_isready -U pluralsight
            failureThreshold: 5
            periodSeconds: 5
            timeoutSeconds: 3
          name: postgres
          ports:
            - containerPort: 5432
              protocol: TCP
      imagePullSecrets:
        - name: regcred
      restartPolicy: Always
