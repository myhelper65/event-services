apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o eventservice_chart/templates
    kompose.image-pull-secret: regcred
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: mongo
  name: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mongo
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o eventservice_chart/templates
        kompose.image-pull-secret: regcred
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: mongo
    spec:
      containers:
        -  name: mongo 
           image: '{{ .Values.IMAGE_TAG_MONGO }}:{{ .Values.mongo.image.repository }}'
           imagePullPolicy: {{ .Values.mongo.image.pullPolicy }}
    imagePullPolicy: {{ .Values.mongo.image.pullPolicy }}
          livenessProbe:
            exec:
              command:
                - mongosh --eval "db.adminCommand('ping')"
            failureThreshold: 5
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
          name: mongo
          ports:
            - containerPort: 27017
              protocol: TCP
      imagePullSecrets:
        - name: regcred
      restartPolicy: Always
