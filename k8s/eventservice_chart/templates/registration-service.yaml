apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o eventservice_chart/templates
    kompose.image-pull-secret: regcred
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    app: registration   # <-- use the same label as deployment
  name: registration
spec:
  type: NodePort
  selector:
    app: registration   # <-- must match deployment pod labels
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
