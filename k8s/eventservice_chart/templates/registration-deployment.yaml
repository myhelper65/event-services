apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o eventservice_chart/templates
    kompose.image-pull-secret: regcred
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    app: registration
  name: registration
spec:
  replicas: 2
  selector:
    matchLabels:
      app: registration
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o eventservice_chart/templates
        kompose.image-pull-secret: regcred
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        app: registration
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.28
          command:
            - sh
            - -c
            - >
              echo "Waiting for postgres..."; 
              until nc -z postgres 5432; do 
                echo "Postgres is unavailable - sleeping"; 
                sleep 2; 
              done;
              echo "Postgres is up!"
      containers:
        - name: registration
          image: '{{ .Values.IMAGE_TAG_REGISTRATION }}'
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
          ports:
            - containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      imagePullSecrets:
        - name: regcred
      restartPolicy: Always
