apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eventservice_chart.fullname" . }}-event-service
  labels:
    app.kubernetes.io/name: {{ include "eventservice_chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: event-service
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "eventservice_chart.name" . }}
      app.kubernetes.io/component: event-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "eventservice_chart.name" . }}
        app.kubernetes.io/component: event-service
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: event-service
          image: "{{ .Values.eventService.image.repository }}:{{ .Values.eventService.image.tag | default .Chart.AppVersion }}"
          ports:
            - containerPort: 8081
              protocol: TCP
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets | first | default "regcred" }}
      restartPolicy: Always
