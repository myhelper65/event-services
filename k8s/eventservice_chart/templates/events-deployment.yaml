apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o eventservice_chart/templates
    kompose.image-pull-secret: regcred
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: events
  name: events
spec:
  replicas: 2
  selector:
    matchLabels:
      io.kompose.service: events
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o eventservice_chart/templates
        kompose.image-pull-secret: regcred
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: events
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done;']

      containers:
        - env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
          image: "{{ .Values.events.image.repository }}:{{ .Values.events.image.tag }}"
          livenessProbe:
            exec:
              command:
                - curl -f http://localhost:8081/actuator/health
            failureThreshold: 5
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          name: events
          ports:
            - containerPort: 8081
              protocol: TCP
      imagePullSecrets:
        - name: regcred
      restartPolicy: Always