apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o eventservice_chart/templates
    kompose.image-pull-secret: regcred
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    app: events  # <- standardized label
  name: events
spec:
  replicas: 2
  selector:
    matchLabels:
      app: events  # <- selector must match pod template labels
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o eventservice_chart/templates
        kompose.image-pull-secret: regcred
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        app: events  # <- standardized pod label
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox
          command:
            - sh
            - -c
            - >
              echo "Waiting for MongoDB...";
              until nc -z mongo 27017; do
                echo "MongoDB not ready - sleeping";
                sleep 2;
              done;
              echo "MongoDB is ready."
      containers:
        - name: events
          image: '{{ .Values.IMAGE_TAG_EVENTS }}'
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
          ports:
            - containerPort: 8081
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - curl
                - -f
                - http://localhost:8081/actuator/health
            failureThreshold: 3
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
      imagePullSecrets:
        - name: regcred
      restartPolicy: Always
