apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o eventservice_chart/templates
    kompose.image-pull-secret: regcred
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: registration-service
  name: registration-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: registration-service
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o eventservice_chart/templates
        kompose.image-pull-secret: regcred
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: registration-service
    spec:
      containers:
        - image: '{{ .Values.IMAGE_TAG_REGISTRATION_SERVICE }}'
          name: registration-service
          ports:
            - containerPort: 8085
              protocol: TCP
      imagePullSecrets:
        - name: regcred
      restartPolicy: Always
