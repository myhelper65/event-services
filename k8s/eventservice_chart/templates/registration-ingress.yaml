apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registration-ingress
  namespace: eventservice-qa
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: tecitlab.org
      http:
        paths:
          - path: /registrations/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: registration
                port:
                  number: 8080
