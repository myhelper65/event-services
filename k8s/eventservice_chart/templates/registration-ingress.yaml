{{- if .Values.DNS_NAME }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registration-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.DNS_NAME }}
      http:
        paths:
          - path: /registrations/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: registration
                port:
                  number: 8080
{{- end }}
