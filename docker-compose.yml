services:
  mongo:
    image: mongo
    ports:
      - '27017:27017'
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres
    environment:
      POSTGRES_USER: pluralsight
      POSTGRES_PASSWORD: pluralsight
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluralsight"]
      interval: 5s
      timeout: 3s
      retries: 5

  events:
    image: events-service:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - "SPRING_PROFILES_ACTIVE=docker"
    ports:
      - '8081:8081'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  registration:
    image: registration-service:dev
    depends_on:
      mongo:
        condition: service_healthy
      events:
        condition: service_healthy
    environment:
      - "SPRING_PROFILES_ACTIVE=docker"
    ports:
      - '8085:8080'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
